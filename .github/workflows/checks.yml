name: Tests and acceptance contract
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:codex-acp-guardian
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/acceptance.py validate
      - name: Require acceptance impact for behavior changes
        if: github.event_name == 'pull_request'
        env:
          ACCEPTANCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/acceptance.py impact --event "$GITHUB_EVENT_PATH" --base "$ACCEPTANCE_BASE"
